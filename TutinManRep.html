  </div>

<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const COA_SECTIONS={income:'Income',cogs:'Cost of Sales',other_income:'Other Income',expense:'Expenses',other_expense:'Other Expenses',asset_noncurrent:'Non-current Assets',asset_current:'Current Assets',liability_noncurrent:'Non-current Liabilities',liability_current:'Current Liabilities',equity:'Equity'};

// PPE asset classes — each has cost, acc_dep (BS) and dep (P&L expense) accounts
const PPE_CLASSES=[
  {key:'fixed_property',    label:'Fixed Property'},
  {key:'plant_machinery',   label:'Plant and Machinery'},
  {key:'electronic_equip',  label:'Electronic Equipment'},
  {key:'furniture_fixtures',label:'Furniture and Fixtures'},
  {key:'motor_vehicles',    label:'Motor Vehicles'},
  {key:'custom1',           label:'Custom Asset 1',  custom:true},
  {key:'custom2',           label:'Custom Asset 2',  custom:true},
];
// Hardcoded COG sort overrides: opening stock = first, closing stock = last
const COGS_SORT={
  'cogs.opening_stock': -1000,
  'cogs.closing_stock':  1000,
};

const REPORTING_COA=[
 {id:'income.sales',name:'Sales',type:'income'},
 {id:'income.discounts',name:'Discounts Allowed',type:'income'},
 // COGS — opening stock pinned first, closing stock pinned last
 {id:'cogs.opening_stock',name:'Opening Stock',type:'cogs',pinnedCogs:'first'},
 {id:'cogs.purchases',name:'Purchases / Cost of Sales',type:'cogs'},
 {id:'cogs.direct_labour',name:'Direct Labour',type:'cogs'},
 {id:'cogs.freight_in',name:'Freight In',type:'cogs'},

function moneyD(n){n=Number(n||0);if(n===0)return '';let abs=Math.abs(n);let v=abs.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?'('+v+')':v}
function pct(n){let v=Number(n||0);if(v===0)return '';return (v*100).toFixed(0)+'%'}
function trafficDot(varPct,isExpense){
  // For income/GP/NP: positive variance = good. For expenses: positive variance = bad (over budget).
  let v=Number(varPct||0);
  if(v===0)return '';
  let good=isExpense?v<0:v>0;
  let abs=Math.abs(v);
  let color=abs<0.05?'#f59e0b':(good?'#16a34a':'#dc2626');
  if(abs>=0.05&&!good)color='#dc2626';
  if(abs>=0.05&&good)color='#16a34a';
  if(abs<0.05)color='#f59e0b';
  return '<span class="traffic-dot" title="'+(v*100).toFixed(1)+'% variance" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+color+';margin-left:4px;vertical-align:middle;box-shadow:0 0 3px '+color+'88;-webkit-print-color-adjust:exact;print-color-adjust:exact"></span>';
}
function num(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;return Number(String(v).replace(/[^0-9.-]/g,''))||0}
function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function periodKey(v){
  if(!v)return null;
  // Handle Date objects from XLSX (already parsed) — use local date parts to avoid UTC shift
  if(v instanceof Date){
    let y=v.getFullYear(),m=v.getMonth()+1;
    if(y>2000&&y<2100)return y+'-'+String(m).padStart(2,'0');
    return null;
  }
  let s=String(v).trim();
  // Already YYYY-MM
  if(/^\d{4}-\d{2}$/.test(s))return s;
  // Match "Apr 2026" or "April 2026" — parse without Date constructor to avoid UTC timezone shift
  let mn=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let m=s.match(/([A-Za-z]{3,})\s*(\d{4})/);
  if(m){let i=mn.indexOf(m[1].slice(0,3).toLowerCase());if(i>=0)return m[2]+'-'+String(i+1).padStart(2,'0');}
  // Match "2026-04-01" style
  let d2=s.match(/^(\d{4})-(\d{2})-\d{2}$/);
  if(d2)return d2[1]+'-'+d2[2];
  return null;
}

function ensureClientDefaults(){
  client.settings=client.settings||{};
  if(!client.settings.preparedBy)client.settings.preparedBy='';
  if(!client.settings.logoData)client.settings.logoData=DEFAULT_LOGO;
  if(!client.reportingCOA)client.reportingCOA=JSON.parse(JSON.stringify(REPORTING_COA));
  // Merge any master COA accounts missing from this client's stored COA (e.g. new PPE accounts added in later versions)
  REPORTING_COA.forEach(masterEntry=>{
    if(!client.reportingCOA.find(x=>x.id===masterEntry.id)){
      client.reportingCOA.push(JSON.parse(JSON.stringify(masterEntry)));
    }
  });
  if(!client.raw)client.raw={};
  if(!client.raw.pl)client.raw.pl={periods:[],accounts:{}};
  if(!client.raw.bs)client.raw.bs={asOf:null,accounts:{}};
  if(!client.raw.ar)client.raw.ar={asOf:null,rows:[]};
  if(!client.raw.ap)client.raw.ap={asOf:null,rows:[]};
  if(!client.raw.pl_py)client.raw.pl_py={periods:[],accounts:{}};
  if(!client.raw.bs_py)client.raw.bs_py={asOf:null,accounts:{}};
  if(!client.kpiBenchmarks)client.kpiBenchmarks={sales_growth_month:0.05,sales_growth_ytd:0.05,gp_pct:0.50,np_pct:0.10,labour_pct:0.20,labour_productivity:2.5,current_ratio:1.50,debtor_days:30,creditor_days:45,vat_rate:0.07};
  if(!client.kpiComments)client.kpiComments={};
  if(!client.kpiManual)client.kpiManual={tax_clearance:false,cipc_month:'',narrative:''};
  if(!client.ppeNotes)client.ppeNotes={};
  if(!client.budgetPctMode)client.budgetPctMode={};
  if(!client.mappingConfirmed)client.mappingConfirmed={};
  // Legacy: existing mappings with no confirmed flag treated as confirmed
  Object.keys(client.mappings||{}).forEach(k=>{if(client.mappingConfirmed[k]===undefined)client.mappingConfirmed[k]=true;});
  // v3.0 additions
  // Auto-deduplicate COA: keep first occurrence of each id
  if(client.reportingCOA){
    let seen={};
    client.reportingCOA=client.reportingCOA.filter(c=>{
      if(seen[c.id])return false;
      seen[c.id]=true;return true;
    });
  }
  // Sweep orphaned reportNoteRefs: remove refs where the note no longer exists
  if(client.reportNoteRefs&&client.notes){
    let existingNums=new Set((client.notes||[]).map(n=>n.number));
    Object.keys(client.reportNoteRefs).forEach(k=>{
      if(!existingNums.has(client.reportNoteRefs[k]))delete client.reportNoteRefs[k];
    });
  }
  // Sweep duplicate refs: if two COA ids point to the same note number, keep only the last (most recently assigned)
  if(client.reportNoteRefs){
    let numToKey={};
    Object.keys(client.reportNoteRefs).forEach(k=>{
      let n=client.reportNoteRefs[k];
      if(numToKey[n])delete client.reportNoteRefs[numToKey[n]]; // remove earlier duplicate
      numToKey[n]=k;
    });
  }
  if(client.settings.pyLocked===undefined)client.settings.pyLocked=false;
  if(!client.revenueStreams)client.revenueStreams=[];
  // Ensure all P&L COA entries have streamId field (null = shared/apportion)
  (client.reportingCOA||[]).forEach(co=>{if(co.streamId===undefined)co.streamId=null;});
}

function allReportingCOA(){ensureClientDefaults();return client.reportingCOA.sort((a,b)=>{let so=coaOrder(a)-coaOrder(b);if(so!==0)return so;if(a.type==='cogs'&&b.type==='cogs'){let cs=cogsSortKey(a)-cogsSortKey(b);if(cs!==0)return cs;}return String(a.name).localeCompare(String(b.name));});}

function addStream(){
  ensureClientDefaults();
  let name=document.getElementById('newStreamName').value.trim();
  let color=document.getElementById('newStreamColor').value||'#8B1A1A';
  if(!name){alert('Enter a stream name.');return;}
  if(client.revenueStreams.find(s=>s.name.toLowerCase()===name.toLowerCase())){alert('A stream with that name already exists.');return;}
  let id='stream_'+Date.now();
  client.revenueStreams.push({id,name,color});
  document.getElementById('newStreamName').value='';
  renderAll();
}
function removeStream(i){
  ensureClientDefaults();
  let s=client.revenueStreams[i];
  if(!s)return;
  let tagged=(client.reportingCOA||[]).filter(co=>co.streamId===s.id).length;
  let msg='Remove stream "'+s.name+'"?'+(tagged?' This will clear the stream tag from '+tagged+' COA account'+(tagged!==1?'s':'')+'.':'');
  if(!confirm(msg))return;
  // Clear stream tags
  (client.reportingCOA||[]).forEach(co=>{if(co.streamId===s.id)co.streamId=null;});
  client.revenueStreams.splice(i,1);
  renderAll();
}

let _skipNextSync=false; // prevents syncSettingsFromForm from overwriting a freshly loaded client
function syncSettingsFromForm(){
  if(_skipNextSync){_skipNextSync=false;return;}
  let ids=['clientName','currency','industry','reportMonth','status','preparedBy'];
  ids.forEach(id=>{let el=document.getElementById(id);if(el)client.settings[id]=el.value});
  let fy=document.getElementById('fyStartMonth');if(fy)client.settings.fyStartMonth=+fy.value;
  let cn=document.getElementById('clientNotes');if(cn)client.settings.notes=cn.value;
  // KPI Benchmarks (stored as decimals)
  ensureClientDefaults();
  let bKeys={kb_sales_growth_month:'sales_growth_month',kb_sales_growth_ytd:'sales_growth_ytd',kb_gp_pct:'gp_pct',kb_np_pct:'np_pct',kb_labour_pct:'labour_pct',kb_labour_productivity:'labour_productivity',kb_current_ratio:'current_ratio',kb_debtor_days:'debtor_days',kb_creditor_days:'creditor_days',kb_vat_rate:'vat_rate'};
  Object.entries(bKeys).forEach(([elId,key])=>{let el=document.getElementById(elId);if(el){let v=parseFloat(el.value);if(!isNaN(v)){// pct fields stored as decimal

function generateBreakdownNotes(){
  // For every reporting line with 2+ QBO accounts mapped (BS or P&L),
  // create or update a breakdown note. Preserves existing note number, heading and comment.
  ensureClientDefaults();
  let bs=client.raw.bs.accounts||{};
  let pl=client.raw.pl.accounts||{};
  let periods=client.raw.pl.periods||[];
  // Group QBO accounts by reporting COA id — BS accounts use their balance value
  let groups={};
  Object.entries(bs).forEach(([qboName,val])=>{
    let id=client.mappings[qboName];
    if(!id)return;
    if(!groups[id])groups[id]=[];
    // Avoid adding same name twice (BS account already there)
    if(!groups[id].find(x=>x.name===qboName))
      groups[id].push({name:qboName,val:num(val),source:'bs'});
  });
  // P&L accounts — store account name and source only (amounts calculated live in viewer)
  Object.entries(pl).forEach(([qboName,monthly])=>{
    let id=client.mappings[qboName];
    if(!id)return;
    if(!groups[id])groups[id]=[];
    if(!groups[id].find(x=>x.name===qboName))
      groups[id].push({name:qboName,val:0,source:'pl'});
  });
  Object.entries(groups).forEach(([id,items])=>{
    if(items.length<2)return;
    let coaEntry=client.reportingCOA.find(x=>x.id===id);
    if(!coaEntry)return;
    // Check if a breakdown note already exists for this id
    let existingNoteNum=client.reportNoteRefs[id];
    let existingNote=existingNoteNum?client.notes.find(n=>n.number===existingNoteNum&&n.type==='breakdown'):null;
    if(existingNote){
      // Update amounts only — preserve number, heading, comment
      existingNote.breakdown=items;
    } else {
      // Assign next available note number
      let num=nextOpenNoteNumber();
      let heading=coaEntry.name+' — Detail';
      client.notes.push({number:num,heading,comment:'',type:'breakdown',breakdown:items});
      client.notes.sort((a,b)=>a.number-b.number);
      client.reportNoteRefs[id]=num;
    }
  });
  // Remove stale breakdown notes whose reporting line no longer has 2+ accounts
  client.notes=client.notes.filter(n=>{
    if(n.type!=='breakdown')return true;
    // Find the reportNoteRef that points to this note
    let refId=Object.keys(client.reportNoteRefs).find(k=>client.reportNoteRefs[k]===n.number);
    if(!refId)return false; // orphaned — remove
    let grp=groups[refId];
    if(!grp||grp.length<2){
      // No longer qualifies — remove ref and note
      delete client.reportNoteRefs[refId];
      return false;
    }
    return true;
  });
}

// Updates all computed totals (row totals, section totals, GP/NP, % rows and any %-of-income
// linked cells) in place, without touching any <input> element. This is what keeps the cursor,
// selection and scroll position intact while typing budget figures — no innerHTML rebuild.
function updateBudgetTotals(){
  let months=fyMonths();
  reportingCOA().forEach(c=>{
    let total=months.reduce((s,m)=>s+num(client.budgets[c.id]?.[m]),0);
    bqTxt(`[data-rowtotal="${cssEsc(c.id)}"]`,money(total));
    if(client.budgetPctMode&&client.budgetPctMode[c.id]){
      months.forEach(m=>{
        let el=document.querySelector(`[data-acc="${cssEsc(c.id)}"][data-month="${m}"]`);
        if(el){let v=client.budgets[c.id]?.[m];el.textContent=(v===undefined||v===null||v==='')?'0':String(Math.round(num(v)));}
      });
    }
  });
  ['income','cogs','other_income','expense','other_expense'].forEach(type=>{
    months.forEach(m=>bqTxt(`[data-row="sec-${type}"][data-month="${m}"]`,money(budgetSum(type,m))));
    bqTxt(`[data-row="sec-${type}"][data-col="total"]`,money(months.reduce((s,m)=>s+budgetSum(type,m),0)));
  });
  months.forEach(m=>{
    let inc=budgetSum('income',m),gp=inc-budgetSum('cogs',m),np=gp+budgetSum('other_income',m)-budgetSum('expense',m)-budgetSum('other_expense',m);
    bqTxt(`[data-row="gp"][data-month="${m}"]`,money(gp));
    bqTxt(`[data-row="gp-pct"][data-month="${m}"]`,pct(inc?gp/inc:0));
    bqTxt(`[data-row="np"][data-month="${m}"]`,money(np));
    bqTxt(`[data-row="np-pct"][data-month="${m}"]`,pct(inc?np/inc:0));
  });
  let incT=months.reduce((s,m)=>s+budgetSum('income',m),0);
  let gpT=months.reduce((s,m)=>s+budgetSum('income',m)-budgetSum('cogs',m),0);
  let npT=months.reduce((s,m)=>s+budgetSum('income',m)-budgetSum('cogs',m)+budgetSum('other_income',m)-budgetSum('expense',m)-budgetSum('other_expense',m),0);
  bqTxt(`[data-row="gp"][data-col="total"]`,money(gpT));
  bqTxt(`[data-row="gp-pct"][data-col="total"]`,pct(incT?gpT/incT:0));
  bqTxt(`[data-row="np"][data-col="total"]`,money(npT));
  bqTxt(`[data-row="np-pct"][data-col="total"]`,pct(incT?npT/incT:0));
}

(function initBudgetDragScroll(){
  let el=document.getElementById('budgetScrollWrap');
  if(!el)return;
  let isDown=false,startX=0,scrollLeft=0;
  el.addEventListener('mousedown',e=>{
    // Only drag on the wrap itself or non-input cells
    if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SELECT')return;
    isDown=true;startX=e.pageX-el.offsetLeft;scrollLeft=el.scrollLeft;el.style.userSelect='none';
  });
  document.addEventListener('mouseup',()=>{isDown=false;if(el)el.style.userSelect='';});
  el.addEventListener('mousemove',e=>{if(!isDown)return;e.preventDefault();let x=e.pageX-el.offsetLeft;el.scrollLeft=scrollLeft-(x-startX);});
})()

function clearOrphanedRefs(){
  ensureClientDefaults();
  let existingNums=new Set((client.notes||[]).map(n=>n.number));
  let removed=0;
  Object.keys(client.reportNoteRefs).forEach(k=>{
    if(!existingNums.has(client.reportNoteRefs[k])){
      delete client.reportNoteRefs[k];
      removed++;
    }
  });
  // Also clear duplicate refs (same note number on multiple COA lines — keep none, user must reassign)
  let numCount={};
  Object.entries(client.reportNoteRefs).forEach(([k,v])=>{numCount[v]=(numCount[v]||0)+1;});
  Object.keys(client.reportNoteRefs).forEach(k=>{
    let v=client.reportNoteRefs[k];
    if(numCount[v]>1){delete client.reportNoteRefs[k];removed++;}
  });
  renderAll();
  alert(removed+' orphaned note reference'+(removed!==1?'s':'')+' cleared.'+(removed===0?' No orphans found.':''));
}
function renumberNotes(){
  // Compact note numbers: sort by current number, reassign 1,2,3... 
  // Update reportNoteRefs to match new numbers
  ensureClientDefaults();
  client.notes.sort((a,b)=>a.number-b.number);
  let newNums={};
  client.notes.forEach((n,i)=>{newNums[n.number]=i+1;n.number=i+1;});
  // Update reportNoteRefs
  Object.keys(client.reportNoteRefs).forEach(k=>{
    let old=client.reportNoteRefs[k];
    if(newNums[old]!==undefined)client.reportNoteRefs[k]=newNums[old];
  });
  renderAll();
}

function mappedTotals(source,period=null){let out={};reportingCOA().forEach(c=>out[c.id]=0);let raw=client.raw[source]||{};if(source==='pl'||source==='pl_py'){Object.entries(raw.accounts||{}).forEach(([a,vals])=>{let id=client.mappings[a];if(id)out[id]+=num(period?vals[period]:0)});}if(source==='bs'||source==='bs_py'){Object.entries(raw.accounts||{}).forEach(([a,val])=>{let id=client.mappings[a];if(id)out[id]+=num(val)});}return out}
function sumByType(tot,type){let types=Array.isArray(type)?type:[type];return reportingCOA().filter(c=>{if(c.smartFlip){// smartFlip: count under other_income when positive, other_expense when negative
let v=num(tot[c.id]);return types.includes('other_income')?v>=0:types.includes('other_expense')?v<0:false;}return types.includes(c.type);}).reduce((s,c)=>s+num(tot[c.id]),0)}

function currentAssetAmount(bs){let bank=num(bs['asset_current.bank']),vat=num(bs['asset_current.vat']);return Math.max(bank,0)+Math.max(vat,0)+['asset_current.inventory','asset_current.trade_debtors','asset_current.other_receivables'].reduce((s,id)=>s+num(bs[id]),0)}
function currentLiabilityAmount(bs){let bank=num(bs['asset_current.bank']),vat=num(bs['asset_current.vat']);return Math.max(-bank,0)+Math.max(-vat,0)+['liability_current.trade_creditors','liability_current.paye_uif_sdl','liability_current.income_tax','liability_current.short_term_borrowings','liability_current.other_current_liabilities'].reduce((s,id)=>s+num(bs[id]),0)}
function bsMonthKey(asOf){
  // Convert any BS date format to YYYY-MM for comparison
  // Handles: '2026-05', '31 May, 2026', 'May 31, 2026', '2026-05-31' etc.
  if(!asOf)return '';
  if(/^\d{4}-\d{2}$/.test(asOf))return asOf; // already YYYY-MM
  if(/^\d{4}-\d{2}-\d{2}$/.test(asOf))return asOf.slice(0,7); // YYYY-MM-DD
  let d=new Date(asOf);
  if(!isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return asOf; // fallback — return as-is
}

// ── Revenue Stream Apportionment ─────────────────────────────────────────────

// Get all streams defined for this client
function getStreams(){return client.revenueStreams||[];}

// For a given stream, calculate its income and COGS totals from mapped YTD data
// Returns {income, cogs, gp, expenses_linked} for the stream
function calcStreamTotals(streamId, ytdTotals, cmTotals){
  ensureClientDefaults();
  let streams=getStreams();
  // income + cogs for this stream
  let income=0,cogs=0,expLinked=0,incCM=0,cogsCM=0;
  reportingCOA().filter(co=>co.streamId===streamId).forEach(co=>{
    if(co.type==='income')    {income+=num(ytdTotals[co.id]);incCM+=num(cmTotals[co.id]);}
    if(co.type==='cogs')      {cogs+=num(ytdTotals[co.id]);cogsCM+=num(cmTotals[co.id]);}
    if(co.type==='expense'||co.type==='other_expense') {expLinked+=num(ytdTotals[co.id]);}
  });
  return {income,cogs,gp:income-cogs,expLinked,incCM,cogsCM};
}

// For the combined view: all income, all cogs, sum GP across all streams
function calcAllStreamGP(ytdTotals, cmTotals){
  ensureClientDefaults();
  let streams=getStreams();
  if(!streams.length)return {totalGP:0,totalIncome:0,byStream:{}};
  let byStream={};
  let totalGP=0, totalIncome=0;
  streams.forEach(s=>{
    let t=calcStreamTotals(s.id,ytdTotals,cmTotals);
    byStream[s.id]=t;
    totalGP+=t.gp;
    totalIncome+=t.income;
  });
  return {totalGP,totalIncome,byStream};
}

// Calculate apportionment ratio for a given stream
// Returns fraction (0-1) of shared expenses to allocate to this stream
// Uses GP% if totalGP > 0, else falls back to revenue %
function streamApportionRatio(streamId, ytdTotals, cmTotals){
  let {totalGP,totalIncome,byStream}=calcAllStreamGP(ytdTotals,cmTotals);
  let s=byStream[streamId];
  if(!s)return 0;
  if(totalGP>0){
    return s.gp/totalGP; // GP-based apportionment
  } else if(totalIncome>0){
    return s.income/totalIncome; // Fallback to revenue
  }
  return 0;
}

// Build a filtered P&L data object for a specific stream view
// For the stream view:
//   - income/cogs: only accounts tagged to this stream
//   - expense/other_expense: accounts tagged to this stream (full) + shared (apportioned)
//   - other_income: accounts tagged to this stream only (shared OI excluded — too complex to apportion)
// Returns: {cm, ytd} filtered/apportioned objects with same structure as mappedTotals output
function buildStreamPL(streamId, c){
  ensureClientDefaults();
  let ratio=streamApportionRatio(streamId, c.ytd, c.cm);
  let usedGPBasis=calcAllStreamGP(c.ytd,c.cm).totalGP>0;
  let out_cm={}, out_ytd={};
  reportingCOA().forEach(co=>{out_cm[co.id]=0;out_ytd[co.id]=0;});
  reportingCOA().forEach(co=>{
    let plType=['income','cogs','expense','other_expense','other_income'].includes(co.type);
    if(!plType)return;
    let tagged=co.streamId===streamId;
    let shared=!co.streamId; // null/undefined = shared
    let otherStream=co.streamId&&co.streamId!==streamId;
    if(otherStream)return; // exclude
    if(tagged){
      out_cm[co.id]=num(c.cm[co.id]);
      out_ytd[co.id]=num(c.ytd[co.id]);
    } else if(shared&&['expense','other_expense'].includes(co.type)){
      // Apportion shared expenses
      out_cm[co.id]=num(c.cm[co.id])*ratio;
      out_ytd[co.id]=num(c.ytd[co.id])*ratio;
    }
    // Shared income/cogs/other_income: excluded from stream view
  });
  return {cm:out_cm, ytd:out_ytd, ratio, usedGPBasis};
}

function reportCalc(){let rm=client.settings.reportMonth;let months=fyMonths();let idx=months.indexOf(rm);// Cap: only use months up to and including rm (ignore any imported data beyond)
let ytdMonths=months.slice(0,idx+1);let cm=mappedTotals('pl',rm);let pmKey=months[idx-1];let pm=pmKey?mappedTotals('pl',pmKey):{};let ytd={};reportingCOA().forEach(c=>ytd[c.id]=ytdMonths.reduce((s,m)=>s+mappedTotals('pl',m)[c.id],0));let bs=mappedTotals('bs');let rev=sumByType(ytd,'income'), cogs=sumByType(ytd,'cogs'), otherInc=sumByType(ytd,'other_income'), exp=sumByType(ytd,'expense'), otherExp=sumByType(ytd,'other_expense');let gp=rev-cogs,np=gp+otherInc-exp-otherExp;let ar=(client.raw.ar.rows||[]).reduce((s,r)=>s+r.total,0), ap=(client.raw.ap.rows||[]).reduce((s,r)=>s+r.total,0);let cash=bs['asset_current.bank']||0;let currentAssets=currentAssetAmount(bs);let currentLiab=currentLiabilityAmount(bs);let debtorDays=rev?ar/rev*(idx+1)*30:0, creditorDays=cogs?ap/cogs*(idx+1)*30:0;let invDays=0;// BS date warning — compare at month level only
let bsAsOf=client.raw.bs.asOf||'';let bsDateMismatch=bsAsOf&&bsMonthKey(bsAsOf)!==rm;return{rm,months,idx,cm,pm,ytd,bs,rev,cogs,otherInc,exp,otherExp,gp,np,ar,ap,cash,currentAssets,currentLiab,currentRatio:currentLiab?currentAssets/currentLiab:0,quickRatio:currentLiab?(currentAssets-(bs['asset_current.inventory']||0))/currentLiab:0,debtorDays,creditorDays,workingCapital:currentAssets-currentLiab,cashConversionCycle:debtorDays+invDays-creditorDays,bsDateMismatch,bsAsOf}}
function calcBudgetForTypes(types,months){let t=Array.isArray(types)?types:[types];let ms=Array.isArray(months)?months:[months];return reportingCOA().filter(c=>t.includes(c.type)).reduce((s,c)=>s+ms.reduce((ss,m)=>ss+num(client.budgets[c.id]?.[m]),0),0);}
function qcChecks(){
  ensureClientDefaults();
  let checks=[];
  // 1. Unconfirmed mappings
  let accounts=importedAccountNames();
  let validIds=new Set(reportingCOA().map(c=>c.id));
  let unconfirmed=accounts.filter(a=>{let v=client.mappings[a];return v&&validIds.has(v)&&!client.mappingConfirmed[a];});
  checks.push({id:'mappings',label:'All mappings confirmed',pass:unconfirmed.length===0,detail:unconfirmed.length?`${unconfirmed.length} mapping${unconfirmed.length>1?'s':''} still unconfirmed: ${unconfirmed.slice(0,3).map(esc).join(', ')}${unconfirmed.length>3?'…':''}`:''});
  // 2. AR 60+ days and negatives
  let arIssues=(client.raw.ar.rows||[]).filter(r=>(r.d61_90>0||r.d90>0||r.total<0)&&!client.debtorNotes[r.name]);
  checks.push({id:'ar',label:'All overdue/negative AR amounts have comments (60+ days)',pass:arIssues.length===0,detail:arIssues.length?`${arIssues.length} customer${arIssues.length>1?'s':''} require comments: ${arIssues.slice(0,3).map(r=>esc(r.name)).join(', ')}${arIssues.length>3?'…':''}`:''});
  // 3. AP 60+ days and negatives
  let apIssues=(client.raw.ap.rows||[]).filter(r=>(r.d61_90>0||r.d90>0||r.total<0)&&!client.creditorNotes[r.name]);
  checks.push({id:'ap',label:'All overdue/negative AP amounts have comments (60+ days)',pass:apIssues.length===0,detail:apIssues.length?`${apIssues.length} supplier${apIssues.length>1?'s':''} require comments: ${apIssues.slice(0,3).map(r=>esc(r.name)).join(', ')}${apIssues.length>3?'…':''}`:''});
  // 4. Clearing accounts non-zero
  let clearingBal=num(mappedTotals('bs')['liability_current.clearing_accounts']);
  let clearingNote=client.reportNoteRefs['liability_current.clearing_accounts']?client.notes.find(n=>n.number===client.reportNoteRefs['liability_current.clearing_accounts']):null;
  let clearingOk=clearingBal===0||(clearingNote&&(clearingNote.comment||'').trim().length>0);
  checks.push({id:'clearing',label:'Clearing accounts balance is zero or has explanation',pass:clearingOk,detail:clearingOk?'':`Clearing accounts balance is ${moneyZ(clearingBal)} — add a note explaining the balance`});
  // 5. Unallocated Income
  let c=reportCalc();
  let unallocInc=num(c.ytd['income.unallocated_income']);
  let unallocIncNote=client.reportNoteRefs['income.unallocated_income']?client.notes.find(n=>n.number===client.reportNoteRefs['income.unallocated_income']):null;
  let unallocIncOk=unallocInc===0||(unallocIncNote&&(unallocIncNote.comment||'').trim().length>0);
  checks.push({id:'unalloc_income',label:'Unallocated Income is zero or has explanation',pass:unallocIncOk,detail:unallocIncOk?'':`Unallocated Income balance is ${moneyZ(unallocInc)} — add a note explaining what requires allocation`});
  // 6. Unallocated Expenses
  let unallocExp=num(c.ytd['expense.unallocated_expenses']);
  let unallocExpNote=client.reportNoteRefs['expense.unallocated_expenses']?client.notes.find(n=>n.number===client.reportNoteRefs['expense.unallocated_expenses']):null;
  let unallocExpOk=unallocExp===0||(unallocExpNote&&(unallocExpNote.comment||'').trim().length>0);
  checks.push({id:'unalloc_exp',label:'Unallocated Expenses is zero or has explanation',pass:unallocExpOk,detail:unallocExpOk?'':`Unallocated Expenses balance is ${moneyZ(unallocExp)} — add a note explaining what requires allocation`});
  // 7. PPE reconciliation
  let pyBsForQC=mappedTotals('bs_py');let hasPYforQC=Object.keys(client.raw.bs_py.accounts||{}).length>0;
  let ppeFailClasses=[];
  if(hasPYforQC){
    PPE_CLASSES.forEach(p=>{
      let costId='ppe_cost.'+p.key,accDepId='ppe_acc_dep.'+p.key,depId='ppe_dep.'+p.key;
      let costCY=num(c.bs[costId]),accDepCY=num(c.bs[accDepId]),nbvCY=costCY-Math.abs(accDepCY);
      let costPY=num(pyBsForQC[costId]),accDepPY=num(pyBsForQC[accDepId]),nbvPY=costPY-Math.abs(accDepPY);
      let depYtd=num(c.ytd[depId]);
      if(!costCY&&!accDepCY&&!costPY&&!accDepPY&&!depYtd)return;
      let noteKey='ppe_'+p.key;
      let notes=client.ppeNotes[noteKey]||{additions:0,disposals:0};
      let reconClosing=nbvPY+num(notes.additions)-num(notes.disposals)-depYtd;
      let diff=Math.abs(nbvCY-reconClosing);
      if(diff>1){let costEntry=client.reportingCOA.find(x=>x.id===costId);let lbl=costEntry?costEntry.name.replace(' — Cost',''):p.label;ppeFailClasses.push(lbl);}
    });
  }
  let ppeOk=!hasPYforQC||ppeFailClasses.length===0;
  checks.push({id:'ppe',label:'PPE reconciliation balances (all asset classes)',pass:ppeOk,detail:ppeOk?(hasPYforQC?'':'No prior year BS imported — PPE reconciliation skipped'):`${ppeFailClasses.length} class${ppeFailClasses.length>1?'es':''} with reconciliation differences: ${ppeFailClasses.join(', ')}`});
  // 8. Balance sheet balances (Assets = Equity + Liabilities)
  let hasBSdata=Object.keys(client.raw.bs.accounts||{}).length>0;
  if(hasBSdata){
    let bsTot=mappedTotals('bs');
    // Total assets: all asset_current (autoFlip positives only) + asset_noncurrent (via PPE NBV + non-PPE)
    let bsAssetCurrent=reportingCOA().filter(x=>x.type==='asset_current').reduce((s,co)=>{
      let v=num(bsTot[co.id]);
      return s+(co.autoFlip?Math.max(v,0):v);
    },0);
    let bsAssetNoncurrent=reportingCOA().filter(x=>x.type==='asset_noncurrent'&&!x.ppeRole).reduce((s,co)=>s+num(bsTot[co.id]),0);
    // PPE NBV: sum cost minus abs(acc_dep) per class
    let bsPpeNBV=0;
    PPE_CLASSES.forEach(p=>{
      let costId='ppe_cost.'+p.key,accDepId='ppe_acc_dep.'+p.key;
      bsPpeNBV+=num(bsTot[costId])-Math.abs(num(bsTot[accDepId]));
    });
    // Non-PPE noncurrent asset_noncurrent items (catch-all ppe line if mapped there)
    let bsNonPpeNCA=num(bsTot['asset_noncurrent.ppe'])||0;
    let totalBSAssets=bsAssetCurrent+bsAssetNoncurrent+bsPpeNBV+bsNonPpeNCA;
    // Total equity + liabilities
    let bsEquity=reportingCOA().filter(x=>x.type==='equity').reduce((s,co)=>s+num(bsTot[co.id]),0);
    let bsLiabCurrent=reportingCOA().filter(x=>x.type==='liability_current').reduce((s,co)=>s+num(bsTot[co.id]),0);
    // autoFlip negatives also appear in current liabilities
    let bsAutoFlipLiab=reportingCOA().filter(x=>x.autoFlip).reduce((s,co)=>{
      let v=num(bsTot[co.id]);return s+Math.max(-v,0);
    },0);
    let bsLiabNoncurrent=reportingCOA().filter(x=>x.type==='liability_noncurrent').reduce((s,co)=>s+num(bsTot[co.id]),0);
    let totalBSEqLiab=bsEquity+bsLiabCurrent+bsAutoFlipLiab+bsLiabNoncurrent;
    let bsDiff=Math.abs(totalBSAssets-totalBSEqLiab);
    let bsBalanced=bsDiff<1; // allow R1 rounding tolerance
    checks.push({id:'bs_balance',label:'Balance sheet balances (Assets = Equity + Liabilities)',pass:bsBalanced,detail:bsBalanced?'':`Balance sheet does not balance — Assets: ${moneyZ(totalBSAssets)}, Equity & Liabilities: ${moneyZ(totalBSEqLiab)}, difference: ${moneyZ(bsDiff)}. Check account mappings in COA Mapping.`});
  }
  // 9. Monthly commentary
  let hasNarrative=(client.kpiManual.narrative||'').trim().length>0;
  checks.push({id:'narrative',label:'Monthly commentary entered in Executive Summary',pass:hasNarrative,detail:hasNarrative?'':'Add monthly commentary in Client Settings → Monthly Commentary'});
  // 10. Orphaned note references (ref exists but note was deleted)
  let existingNums=new Set((client.notes||[]).map(n=>n.number));
  let orphanedRefs=Object.entries(client.reportNoteRefs||{}).filter(([k,v])=>!existingNums.has(v));
  let noOrphans=orphanedRefs.length===0;
  checks.push({id:'orphan_refs',label:'No orphaned note references (deleted notes still showing on report)',pass:noOrphans,
    detail:noOrphans?'':orphanedRefs.length+' orphaned ref'+(orphanedRefs.length>1?'s':'')+' — go to Notes and click Renumber to fix, or reload the client file to auto-clear'});
  return checks;
}
function canMoveTo(targetStatus){
  if(targetStatus!=='Final')return {ok:true,fails:[]};
  let fails=qcChecks().filter(c=>!c.pass);
  return {ok:fails.length===0,fails};
}
function setReportStatus(newStatus){
  ensureClientDefaults();
  if(newStatus==='Final'){
    let {ok,fails}=canMoveTo('Final');
    if(!ok){
      alert('Cannot set to Final. The following QC checks are outstanding:\n\n'+fails.map(f=>'• '+f.label+(f.detail?'\n  '+f.detail:'')).join('\n\n'));
      return;
    }
  }
  client.settings.status=newStatus;
  // Update the select if visible
  let el=document.getElementById('status');if(el)el.value=newStatus;
  renderAll();
}
function renderValidation(){
  ensureClientDefaults();
  let checks=qcChecks();
  let allPass=checks.every(c=>c.pass);
  let status=client.settings.status||'Draft';
  // Import status
  let accounts=[...Object.keys(client.raw.pl.accounts||{}),...Object.keys(client.raw.bs.accounts||{})];
  let validIds=new Set(reportingCOA().map(c=>c.id));
  let unmapped=accounts.filter(a=>!client.mappings[a]||!validIds.has(client.mappings[a]));
  let missingBud=reportingCOA().filter(c=>['income','cogs','other_income','expense','other_expense'].includes(c.type) && !client.budgets[c.id]?.[client.settings.reportMonth]);
  let statusBadge=`<span class="status-badge status-${status.toLowerCase().replace(' ','-')}">${status}</span>`;
  let statusBtns=`<div class="btns" style="margin-top:12px">
    <button class="btn ${status==='Draft'?'primary':''}" onclick="setReportStatus('Draft')">Draft</button>
    <button class="btn ${status==='Under Review'?'primary':''}" onclick="setReportStatus('Under Review')">Under Review</button>
    <button class="btn ${status==='Final'?'primary':''}" onclick="setReportStatus('Final')" ${allPass?'':'title="QC checks must all pass"'}>Final ${allPass?'✓':'🔒'}</button>
  </div>`;
  let qcHtml=checks.map(c=>`<div class="qc-item"><div class="qc-dot ${c.pass?'qc-pass':'qc-fail'}"></div><div><b>${c.label}</b>${c.detail?`<div class="small muted" style="margin-top:2px">${c.detail}</div>`:''}</div></div>`).join('');
  document.getElementById('validation').innerHTML=`<div class="panel"><h2>QC Checklist &amp; Report Status</h2>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px">
      <div><b>Current status:</b> ${statusBadge}</div>${statusBtns}
    </div>
    <div style="margin-bottom:8px">${allPass?'<div class="ok">All QC checks passed. Report is ready to finalise.</div>':'<div class="warning">Complete all QC checks before moving to Final.</div>'}</div>
    <div style="margin:16px 0">${qcHtml}</div>
    <h3>Import status</h3>${table(['Report','Status'],[['P&L',client.raw.pl.periods.length?'Imported':'Missing'],['Balance Sheet',client.raw.bs.asOf?'Imported':'Missing'],['A/R Ageing',client.raw.ar.asOf?'Imported':'Missing'],['A/P Ageing',client.raw.ap.asOf?'Imported':'Missing']])}
    <h3>Unmapped accounts</h3>${table(['Account'],unmapped.map(x=>[esc(x)]))}
    <h3>Missing current-month budgets</h3>${table(['Reporting account'],missingBud.map(c=>[c.name]))}</div>`;
}

function nextOpenNoteNumber(){
  // Must skip numbers already used in reportNoteRefs AND numbers already in the notes list
  let usedRefs=new Set(Object.values(client.reportNoteRefs).map(Number).filter(Boolean));
  let usedNotes=new Set((client.notes||[]).map(x=>Number(x.number)).filter(Boolean));
  let used=new Set([...usedRefs,...usedNotes]);
  let n=1; while(used.has(n))n++; return n;
}
function openNoteModal(id){
  ensureClientDefaults();
  let coaEntry=client.reportingCOA.find(x=>x.id===id);
  let accountName=coaEntry?coaEntry.name:id;
  let existingNum=client.reportNoteRefs[id]||null;  // null = new note
  let noteNum=existingNum||nextOpenNoteNumber();
  // Only pre-fill from existing note if this account already has one linked
  let existingNote=existingNum?client.notes.find(x=>x.number===existingNum):null;
  document.getElementById('noteModalAccountName').textContent=accountName;
  document.getElementById('noteModalNum').textContent=(existingNum?'Edit Note ':'New Note ')+noteNum;
  document.getElementById('noteModalHeading').value=existingNote?existingNote.heading:accountName;
  document.getElementById('noteModalComment').value=existingNote?existingNote.comment:'';
  document.getElementById('noteModalClearBtn').style.display=existingNum?'':'none';
  document.getElementById('noteModal').dataset.id=id;
  document.getElementById('noteModal').dataset.num=noteNum;
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('noteModalComment').focus(),50);
}
function saveNoteModal(){
  try {
    let id=document.getElementById('noteModal').dataset.id;
    let noteNum=+document.getElementById('noteModal').dataset.num;
    let heading=document.getElementById('noteModalHeading').value.trim();
    let comment=document.getElementById('noteModalComment').value.trim();
    client.reportNoteRefs[id]=noteNum;
    let existing=client.notes.find(x=>x.number===noteNum);
    if(existing){existing.heading=heading;existing.comment=comment;}
    else{client.notes.push({number:noteNum,heading:heading,comment:comment});client.notes.sort((a,b)=>a.number-b.number);}
    closeNoteModal();
    renderAll();
  } catch(e) {
    alert('Error saving note: '+e.message);
    console.error(e);
  }
}
function clearNoteModal(){
  try {
    let id=document.getElementById('noteModal').dataset.id;
    delete client.reportNoteRefs[id];
    closeNoteModal();
    renderAll();
  } catch(e) {
    alert('Error clearing note: '+e.message);
    console.error(e);
  }
}
function closeNoteModal(){document.getElementById('noteModal').classList.remove('open');}
function showNoteViewer(id){
  ensureClientDefaults();
  let noteNum=client.reportNoteRefs[id];
  if(!noteNum)return openNoteModal(id); // no note yet — open editor
  let note=client.notes.find(n=>n.number===noteNum);
  if(!note)return openNoteModal(id);
  // Show viewer modal
  document.getElementById('noteViewerHeading').textContent='Note '+noteNum+' — '+note.heading;
  document.getElementById('noteViewerComment').textContent=note.comment||'';
  let content='';
  if(note.type==='breakdown'&&note.breakdown&&note.breakdown.length){
    // Determine if this is a P&L or BS note by checking source of first item
    let isPL=note.breakdown.some(x=>x.source==='pl');
    if(isPL){
      // Calculate live from raw data using current report month
      let c=reportCalc();
      let rm=c.rm;
      let ytdMonths=c.months.slice(0,c.idx+1);
      let plAccounts=client.raw.pl.accounts||{};
      let rows=note.breakdown.map(x=>{
        let monthly=plAccounts[x.name]||{};
        let cmVal=num(monthly[rm]);
        let ytdVal=ytdMonths.reduce((s,m)=>s+num(monthly[m]),0);
        return {name:x.name,cm:cmVal,ytd:ytdVal};
      }).filter(x=>x.cm!==0||x.ytd!==0);
      let totalCM=rows.reduce((s,x)=>s+x.cm,0);
      let totalYTD=rows.reduce((s,x)=>s+x.ytd,0);
      content='<p class="muted small" style="margin:0 0 8px">Report month: <b>'+monthLabel(rm)+'</b></p>'
        +'<table style="width:100%;border-collapse:collapse;font-size:13px">'
        +'<thead><tr>'
        +'<th style="text-align:left;padding:4px 8px;border-bottom:2px solid #111">Account</th>'
        +'<th style="text-align:right;padding:4px 8px;border-bottom:2px solid #111">Current Month</th>'
        +'<th style="text-align:right;padding:4px 8px;border-bottom:2px solid #111">YTD</th>'
        +'</tr></thead><tbody>'
        +rows.map(x=>'<tr><td style="padding:3px 8px;padding-left:16px">'+esc(x.name)+'</td>'
          +'<td style="text-align:right;padding:3px 8px">'+moneyZ(x.cm)+'</td>'
          +'<td style="text-align:right;padding:3px 8px">'+moneyZ(x.ytd)+'</td></tr>').join('')
        +'<tr style="font-weight:bold;border-top:1px solid #111">'
        +'<td style="padding:4px 8px">Total</td>'
        +'<td style="text-align:right;padding:4px 8px">'+moneyZ(totalCM)+'</td>'
        +'<td style="text-align:right;padding:4px 8px">'+moneyZ(totalYTD)+'</td>'
        +'</tr></tbody></table>';
    } else {
      // BS note — show balance from mapped totals (live)
      let bsTotals=mappedTotals('bs');
      // Recalc each item's current value from raw BS
      let bsRaw=client.raw.bs.accounts||{};
      let rows=note.breakdown.map(x=>({name:x.name,val:num(bsRaw[x.name])}))
        .filter(x=>x.val!==0);
      let total=rows.reduce((s,x)=>s+x.val,0);
      content='<table style="width:100%;border-collapse:collapse;font-size:13px">'
        +'<thead><tr>'
        +'<th style="text-align:left;padding:4px 8px;border-bottom:2px solid #111">Account</th>'
        +'<th style="text-align:right;padding:4px 8px;border-bottom:2px solid #111">Balance</th>'
        +'</tr></thead><tbody>'
        +rows.map(x=>'<tr><td style="padding:3px 8px;padding-left:16px">'+esc(x.name)+'</td>'
          +'<td style="text-align:right;padding:3px 8px">'+moneyZ(x.val)+'</td></tr>').join('')
        +'<tr style="font-weight:bold;border-top:1px solid #111">'
        +'<td style="padding:4px 8px">Total</td>'
        +'<td style="text-align:right;padding:4px 8px">'+moneyZ(total)+'</td></tr>'
        +'</tbody></table>';
    }
  } else if(note.type==='ppe'){
    content='<p class="muted small">PPE reconciliation — view in Notes section.</p>';
  }
  document.getElementById('noteViewerContent').innerHTML=content||'<p class="muted small">No detail available.</p>';
  document.getElementById('noteViewerModal').classList.add('open');
}
function closeNoteViewer(){document.getElementById('noteViewerModal').classList.remove('open');}

function reportNoteCell(id){
  if(!window._noteCells)window._noteCells=[];
  let idx=window._noteCells.length;
  window._noteCells.push(id);
  let noteNum=client.reportNoteRefs[id]||'';
  let label=noteNum?String(noteNum):'+';
  let tip=noteNum?'Note '+noteNum+' - click to edit':'Click to add note';
  let setClass=noteNum?'note-set':'note-empty';
  return '<button class="note-cell-btn '+setClass+'" title="'+tip+'" onclick="window._noteCells&&showNoteViewer(window._noteCells['+idx+'])">'+label+'</button>';
}

function plRow(co,c,indent){let budget=num(client.budgets[co.id]?.[c.rm]);let ytdBudget=c.months.slice(0,c.idx+1).reduce((s,m)=>s+num(client.budgets[co.id]?.[m]),0);let cm=num(c.cm[co.id]);let ytd=num(c.ytd[co.id]);let varPct=budget?((cm-budget)/Math.abs(budget)):0;let ytdVarPct=ytdBudget?((ytd-ytdBudget)/Math.abs(ytdBudget)):0;let isExp=['expense','other_expense','cogs'].includes(co.type);let pad=indent?'padding-left:36px':'';let isUnalloc=co.unallocated&&(cm!==0||ytd!==0);let nameStyle=isUnalloc?'font-weight:bold;color:var(--bad)':'';let warnIcon=isUnalloc?' ⚠':'';return[`<span class="indent" style="${pad};${nameStyle}">${esc(co.name)}${warnIcon}</span>`,reportNoteCell(co.id),money(cm),money(budget),`${pct(varPct)}${trafficDot(varPct,isExp)}`,money(ytd),money(ytdBudget),`${pct(ytdVarPct)}${trafficDot(ytdVarPct,isExp)}`];}
function plAccountRows(c,type){
  let rows=[];
  // For smartFlip accounts: show under other_income if cm>=0, under other_expense if cm<0
  // Base type filter respects smartFlip routing
  let all=reportingCOA().filter(x=>{
    if(x.smartFlip){
      let val=num(c.cm[x.id]);
      // Show under other_income when positive/zero, other_expense when negative
      return type==='other_income'?val>=0:type==='other_expense'?val<0:false;
    }
    return x.type===type;
  });
  let parents=all.filter(x=>!x.parentId);
  parents.forEach(co=>{
    let children=all.filter(x=>x.parentId===co.id);
    if(children.length){
      let gCm=num(c.cm[co.id])+children.reduce((s,ch)=>s+num(c.cm[ch.id]),0);
      let gYtd=num(c.ytd[co.id])+children.reduce((s,ch)=>s+num(c.ytd[ch.id]),0);
      let gBud=num(client.budgets[co.id]?.[c.rm])+children.reduce((s,ch)=>s+num(client.budgets[ch.id]?.[c.rm]),0);
      let gYtdBud=c.months.slice(0,c.idx+1).reduce((s,m)=>s+num(client.budgets[co.id]?.[m])+children.reduce((t,ch)=>t+num(client.budgets[ch.id]?.[m]),0),0);
      // Skip entire group if all zeros
      if(gCm===0&&gYtd===0&&gBud===0&&gYtdBud===0)return;
      let gVarPct=gBud?((gCm-gBud)/Math.abs(gBud)):0;
      let gYtdVarPct=gYtdBud?((gYtd-gYtdBud)/Math.abs(gYtdBud)):0;
      rows.push([`<span class="indent"><b>${esc(co.name)}</b></span>`,'','','','','','','','group-header']);
      if(num(c.cm[co.id])!==0||num(c.ytd[co.id])!==0)rows.push(plRow(co,c,true));
      children.forEach(ch=>{if(!plRowIsEmpty(ch,c))rows.push(plRow(ch,c,true));});
      rows.push([`<span class="indent" style="padding-left:36px"><i>Total ${esc(co.name)}</i></span>`,'',money(gCm),money(gBud),pct(gVarPct),money(gYtd),money(gYtdBud),pct(gYtdVarPct),'subtotal-line']);
    } else {
      if(!plRowIsEmpty(co,c))rows.push(plRow(co,c,false));
    }
  });
  return rows;
}

let isAccDep=co.ppeRole==='acc_dep';let dispVal=isAccDep?moneyZ(val):money(Math.abs(val));let dispPyVal=isAccDep?moneyZ(pyVal||0):money(Math.abs(pyVal||0));let row=[`<span class="indent">${esc(co.name)}</span>`,reportNoteCell(co.id),dispVal];if(hasPY)row.push(dispPyVal,`${pct(chg)}${trafficDot(chg,!isAsset)}`);rows.push(row);});let totalRow=[`<b>Total ${esc(label)}</b>`,'',`<b>${moneyZ(total)}</b>`];if(hasPY){let tChg=pyTotal?((total-pyTotal)/Math.abs(pyTotal)):0;totalRow.push(`<b>${moneyZ(pyTotal)}</b>`,`<b>${pct(tChg)}</b>${trafficDot(tChg,false)}`);}totalRow.push('total-line');rows.push(totalRow);return {rows,total,pyTotal}}

function plCalcRow(label,noteId,month,ytd,budget,ytdBudget,cls){cls=cls||'grand-line';let varPct=budget?((month-budget)/Math.abs(budget)):0;let ytdVarPct=ytdBudget?((ytd-ytdBudget)/Math.abs(ytdBudget)):0;return [`<b>${esc(label)}</b>`,noteId?reportNoteCell(noteId):'',`<b>${moneyZ(month)}</b>`,`<b>${moneyZ(budget)}</b>`,`<b>${pct(varPct)}</b>${trafficDot(varPct,false)}`,`<b>${moneyZ(ytd)}</b>`,`<b>${moneyZ(ytdBudget)}</b>`,`<b>${pct(ytdVarPct)}</b>${trafficDot(ytdVarPct,false)}`,cls];}
function plPctRow(label,monthAmt,monthBase,budgetAmt,budgetBase,ytdAmt,ytdBase,ytdBudgetAmt,ytdBudgetBase){
  // Shows actual%, budget%, variance in pp, ytd actual%, ytd budget%, ytd variance pp
  let actPct=monthBase?monthAmt/monthBase:0;
  let budPct=budgetBase?budgetAmt/budgetBase:0;
  let varPp=actPct-budPct; // percentage points variance
  let ytdActPct=ytdBase?ytdAmt/ytdBase:0;
  let ytdBudPct=ytdBudgetBase?ytdBudgetAmt/ytdBudgetBase:0;
  let ytdVarPp=ytdActPct-ytdBudPct;
  let fmtPp=v=>v===0?'':(v>0?'+':'')+( v*100).toFixed(1)+'pp';
  return [`<i style="color:var(--muted);padding-left:12px">${esc(label)}</i>`,'',
    `<i style="color:var(--muted)">${pct(actPct)}</i>`,
    `<i style="color:var(--muted)">${pct(budPct)}</i>`,
    `<i style="color:var(--muted)">${fmtPp(varPp)}</i>`,
    `<i style="color:var(--muted)">${pct(ytdActPct)}</i>`,
    `<i style="color:var(--muted)">${pct(ytdBudPct)}</i>`,
    `<i style="color:var(--muted)">${fmtPp(ytdVarPp)}</i>`];
}

function pyKeys(c){
  // Build prior-year month keys for the same YTD window
  let rmDate=new Date(c.rm+'-01');
  let pyMonthDate=new Date(rmDate.getFullYear()-1,rmDate.getMonth(),1);
  let pyMonthKey=pyMonthDate.getFullYear()+'-'+String(pyMonthDate.getMonth()+1).padStart(2,'0');
  // YTD: same number of months from FY start, but one year back
  let pyYtdKeys=c.months.slice(0,c.idx+1).map(mk=>{
    let d=new Date(mk+'-01');
    d.setFullYear(d.getFullYear()-1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  });
  return {pyMonthKey,pyYtdKeys};
}
function pyTotalsYTD(pyYtdKeys){
  // Sum pl_py across all YTD prior-year months
  let out={};reportingCOA().forEach(c=>out[c.id]=0);
  pyYtdKeys.forEach(k=>{
    let t=mappedTotals('pl_py',k);
    reportingCOA().forEach(co=>out[co.id]+=num(t[co.id]));
  });
  return out;
}
function pyComparisonRows(c,type){
  let all=reportingCOA().filter(x=>x.type===type);
  let rows=[];
  let {pyMonthKey,pyYtdKeys}=pyKeys(c);
  let pyMon=mappedTotals('pl_py',pyMonthKey);
  let pyYtd=pyTotalsYTD(pyYtdKeys);
  let parents=all.filter(x=>!x.parentId);
  parents.forEach(co=>{
    let children=all.filter(x=>x.parentId===co.id);
    let coList=children.length?[co,...children]:[co];
    if(children.length){
      // Skip entire group if all zeros in both periods
      let gCm=num(c.cm[co.id])+children.reduce((s,ch)=>s+num(c.cm[ch.id]),0);
      let gPy=num(pyMon[co.id])+children.reduce((s,ch)=>s+num(pyMon[ch.id]),0);
      let gYtd=num(c.ytd[co.id])+children.reduce((s,ch)=>s+num(c.ytd[ch.id]),0);
      let gPytd=num(pyYtd[co.id])+children.reduce((s,ch)=>s+num(pyYtd[ch.id]),0);
      if(gCm===0&&gPy===0&&gYtd===0&&gPytd===0)return;
      rows.push([`<span class="indent"><b>${esc(co.name)}</b></span>`,'','','','','','','group-header']);
      coList.forEach((a,i)=>{
        let cm=num(c.cm[a.id]),py=num(pyMon[a.id]);
        let ytd=num(c.ytd[a.id]),pytd=num(pyYtd[a.id]);
        if(cm===0&&py===0&&ytd===0&&pytd===0)return;
        let chgM=py?((cm-py)/Math.abs(py)):0;
        let chgY=pytd?((ytd-pytd)/Math.abs(pytd)):0;
        let isExp=['expense','other_expense','cogs'].includes(a.type);
        let pad=(i>0)?'padding-left:36px':'';
        rows.push([`<span class="indent" style="${pad}">${esc(a.name)}</span>`,
          reportNoteCell(a.id),
          money(cm),money(py),`${pct(chgM)}${trafficDot(chgM,isExp)}`,
          money(ytd),money(pytd),`${pct(chgY)}${trafficDot(chgY,isExp)}`]);
      });
      let gChgM=gPy?((gCm-gPy)/Math.abs(gPy)):0;
      let gChgY=gPytd?((gYtd-gPytd)/Math.abs(gPytd)):0;
      let isExp=['expense','other_expense','cogs'].includes(co.type);
      rows.push([`<span class="indent" style="padding-left:36px"><i>Total ${esc(co.name)}</i></span>`,
        '',
        money(gCm),money(gPy),`${pct(gChgM)}${trafficDot(gChgM,isExp)}`,
        money(gYtd),money(gPytd),`${pct(gChgY)}${trafficDot(gChgY,isExp)}`,'subtotal-line']);
    } else {
      let cm=num(c.cm[co.id]),py=num(pyMon[co.id]);
      let ytd=num(c.ytd[co.id]),pytd=num(pyYtd[co.id]);
      if(cm===0&&py===0&&ytd===0&&pytd===0)return;
      let chgM=py?((cm-py)/Math.abs(py)):0;
      let chgY=pytd?((ytd-pytd)/Math.abs(pytd)):0;
      let isExp=['expense','other_expense','cogs'].includes(co.type);
      rows.push([`<span class="indent">${esc(co.name)}</span>`,
        reportNoteCell(co.id),
        money(cm),money(py),`${pct(chgM)}${trafficDot(chgM,isExp)}`,
        money(ytd),money(pytd),`${pct(chgY)}${trafficDot(chgY,isExp)}`]);
    }
  });
  return rows;
}
function pySectionRows(c,type,label){
  let {pyMonthKey,pyYtdKeys}=pyKeys(c);
  let pyMon=mappedTotals('pl_py',pyMonthKey);
  let pyYtd=pyTotalsYTD(pyYtdKeys);
  let rows=[[`<b>${esc(label)}</b>`,'','','','','','','section-line']];
  rows.push(...pyComparisonRows(c,type));
  let cm=sumByType(c.cm,type),ytd=sumByType(c.ytd,type);
  let py=reportingCOA().filter(x=>x.type===type).reduce((s,co)=>s+num(pyMon[co.id]),0);
  let pytd=reportingCOA().filter(x=>x.type===type).reduce((s,co)=>s+num(pyYtd[co.id]),0);
  let chgM=py?((cm-py)/Math.abs(py)):0;
  let chgY=pytd?((ytd-pytd)/Math.abs(pytd)):0;
  let isExp=['expense','other_expense','cogs'].includes(type);
  rows.push([`<b>Total ${esc(label)}</b>`,'',`<b>${moneyZ(cm)}</b>`,`<b>${moneyZ(py)}</b>`,
    `<b>${pct(chgM)}</b>${trafficDot(chgM,isExp)}`,
    `<b>${moneyZ(ytd)}</b>`,`<b>${moneyZ(pytd)}</b>`,
    `<b>${pct(chgY)}</b>${trafficDot(chgY,isExp)}`,'total-line']);
  return rows;
}

function ageingReportTable(rows,noteStore,isDebtors){
  let cols=7;

    ?['Customer','Current + 1-30','31-60','61-90','90+','Total']
    :['Supplier','Current + 1-30','31-60','61-90','90+','Total'];

  rows.forEach(r=>{tCurrent+=r.current;tD31+=r.d31_60;tD61+=r.d61_90;tD90+=r.d90;tTotal+=r.total;});
  let bodyRows=rows.map(r=>{

function calcKPIs(c){
  ensureClientDefaults();
  let b=client.kpiBenchmarks;
  let km=client.kpiManual;
  let rev=c.rev, gp=c.gp, np=c.np, cogs=c.cogs;

  // Prior year revenue for growth KPIs
  let {pyMonthKey,pyYtdKeys}=pyKeys(c);
  let pyMon=mappedTotals('pl_py',pyMonthKey);
  let pyYtd=pyTotalsYTD(pyYtdKeys);
  let revPyMonth=reportingCOA().filter(x=>x.type==='income').reduce((s,co)=>s+num(pyMon[co.id]),0);
  let revPyYtd=reportingCOA().filter(x=>x.type==='income').reduce((s,co)=>s+num(pyYtd[co.id]),0);
  let hasPY=Object.keys(client.raw.pl_py.accounts||{}).length>0;

  // Labour: sum all COA accounts tagged kpiLabour:true
  let labourIds=new Set(client.reportingCOA.filter(x=>x.kpiLabour).map(x=>x.id));
  let labour=c.months.slice(0,c.idx+1).reduce((s,m)=>{
    let t=mappedTotals('pl',m);
    return s+[...labourIds].reduce((ss,id)=>ss+num(t[id]),0);
  },0);

  // VAT: abs(mapped vat BS balance) / rev
  let vatBalance=Math.abs(num(c.bs['asset_current.vat']));
  let vatRate=rev?vatBalance/rev:null;
  let vatAuto=vatBalance>0&&rev>0;

  // Suggest benchmarks from prior year if not manually set
  function suggest(key,val){
    if(!client._kpiBenchmarkSuggested)client._kpiBenchmarkSuggested={};
    if(val!==null&&val!==undefined&&!isNaN(val)){
      client._kpiBenchmarkSuggested[key]=Math.round(val*100)/100;
    }
  }
  if(hasPY&&revPyYtd){suggest('gp_pct',reportingCOA().filter(x=>x.type==='income').reduce((s,co)=>s+num(pyYtd[co.id]),0)-reportingCOA().filter(x=>x.type==='cogs').reduce((s,co)=>s+num(pyYtd[co.id]),0));}

  // KPI rows: {id, category, label, result, resultFmt, benchmark, benchmarkFmt, higherBetter, comment}
  let kpis=[];

  // GROWTH
  if(hasPY){
    let smGrowth=revPyMonth?((num(c.cm[reportingCOA().filter(x=>x.type==='income').reduce((mx,co)=>mx,0)]))||0):null;
    // Simpler: current month revenue vs prior year same month
    let revCm=reportingCOA().filter(x=>x.type==='income').reduce((s,co)=>s+num(c.cm[co.id]),0);
    let smG=revPyMonth?((revCm-revPyMonth)/Math.abs(revPyMonth)):null;
    let ytdG=revPyYtd?((rev-revPyYtd)/Math.abs(revPyYtd)):null;
    kpis.push({id:'sales_growth_month',cat:'GROWTH',label:'Sales – Current Month vs Same Month LY',result:smG,fmt:'pct',benchmark:b.sales_growth_month,higherBetter:true});
    kpis.push({id:'sales_growth_ytd',cat:'GROWTH',label:'Sales – YTD vs Same Period LY',result:ytdG,fmt:'pct',benchmark:b.sales_growth_ytd,higherBetter:true});
  }

  // PROFITABILITY
  kpis.push({id:'gp_pct',cat:'PROFITABILITY',label:'YTD Gross Profit %',result:rev?gp/rev:null,fmt:'pct',benchmark:b.gp_pct,higherBetter:true});
  kpis.push({id:'np_pct',cat:'PROFITABILITY',label:'YTD Net Profit %',result:rev?np/rev:null,fmt:'pct',benchmark:b.np_pct,higherBetter:true});
  if(labourIds.size>0){
    kpis.push({id:'labour_pct',cat:'PROFITABILITY',label:'YTD Labour Cost as % of Sales',result:rev&&labour?labour/rev:null,fmt:'pct',benchmark:b.labour_pct,higherBetter:false});
    kpis.push({id:'labour_productivity',cat:'PROFITABILITY',label:'Labour Productivity (GP per R of Labour)',result:labour?gp/labour:null,fmt:'ratio',benchmark:b.labour_productivity,higherBetter:true});
  }

  // LIQUIDITY
  kpis.push({id:'current_ratio',cat:'LIQUIDITY',label:'Current Ratio – as at period end',result:c.currentRatio||null,fmt:'ratio',benchmark:b.current_ratio,higherBetter:true});
  kpis.push({id:'debtor_days',cat:'LIQUIDITY',label:'Debtor Days',result:c.debtorDays||null,fmt:'days',benchmark:b.debtor_days,higherBetter:false});
  kpis.push({id:'creditor_days',cat:'LIQUIDITY',label:'Creditor Days',result:c.creditorDays||null,fmt:'days',benchmark:b.creditor_days,higherBetter:false});

  // TAX REALITY
  kpis.push({id:'vat_rate',cat:'TAX REALITY',label:'Effective VAT Rate'+(vatAuto?'':' (manual)'),result:vatAuto?vatRate:null,fmt:'pct',benchmark:b.vat_rate,higherBetter:null,manual:!vatAuto});

  return kpis;
}

function kpiFmt(val,fmt){
  if(val===null||val===undefined||isNaN(val))return '—';
  if(fmt==='pct')return (val*100).toFixed(1)+'%';
  if(fmt==='ratio')return val.toFixed(2);
  if(fmt==='days')return Math.round(val)+' days';
  if(fmt==='money')return money(val);
  return String(val);
}

function kpiStatus(kpi){
  if(kpi.result===null||kpi.result===undefined||isNaN(kpi.result))return 'none';
  if(kpi.higherBetter===null)return 'none'; // neutral
  let ratio=kpi.higherBetter?(kpi.result/kpi.benchmark):(kpi.benchmark/kpi.result);
  if(ratio>=0.95)return 'green';
  if(ratio>=0.75)return 'amber';
  return 'red';
}

function kpiDot(kpi){
  let s=kpiStatus(kpi);
  if(s==='none')return '';
  let color=s==='green'?'#16a34a':s==='amber'?'#f59e0b':'#dc2626';
  return '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+color+';vertical-align:middle;box-shadow:0 0 4px '+color+'88;-webkit-print-color-adjust:exact;print-color-adjust:exact" title="'+s+'"></span>';
}

// ── PPE Reconciliation Notes ──────────────────────────────────────────────────
function calcPPENbv(c){
  // Returns total PPE net book value (CY) and prior year NBV
  let pyBs=mappedTotals('bs_py');
  let hasPY=Object.keys(client.raw.bs_py.accounts||{}).length>0;
  let totalNBV=0, totalNBVpy=0, hasAnyPPE=false;
  PPE_CLASSES.forEach(p=>{
    let costCY=num(c.bs['ppe_cost.'+p.key]);
    let accDepCY=num(c.bs['ppe_acc_dep.'+p.key]);
    let nbvCY=costCY-Math.abs(accDepCY);
    totalNBV+=nbvCY;
    if(costCY||accDepCY)hasAnyPPE=true;
    if(hasPY){
      let costPY=num(pyBs['ppe_cost.'+p.key]);
      let accDepPY=num(pyBs['ppe_acc_dep.'+p.key]);
      totalNBVpy+=(costPY-Math.abs(accDepPY));
    }
  });
  return {totalNBV,totalNBVpy,hasAnyPPE,hasPY};
}
function ensurePPENote(){
  // PPE is always Note 1. Create/update it as a special 'ppe' type note.
  ensureClientDefaults();
  let existing=client.notes.find(n=>n.type==='ppe');
  if(!existing){
    // Insert as note 1, shift all other notes up
    client.notes.forEach(n=>{if(n.number>=1)n.number+=1;});
    // Also update reportNoteRefs
    Object.keys(client.reportNoteRefs).forEach(k=>{if(client.reportNoteRefs[k]>=1)client.reportNoteRefs[k]+=1;});
    client.notes.unshift({number:1,heading:'Property, Plant and Equipment',comment:'',type:'ppe'});
    client.reportNoteRefs['__ppe']=1;
  }
  return client.notes.find(n=>n.type==='ppe');
}
function renderPPENoteContent(c){
  ensureClientDefaults();
  let pyBs=mappedTotals('bs_py');
  let hasPY=Object.keys(client.raw.bs_py.accounts||{}).length>0;
  let html='';
  PPE_CLASSES.forEach(p=>{
    let costId='ppe_cost.'+p.key;
    let accDepId='ppe_acc_dep.'+p.key;
    let depId='ppe_dep.'+p.key;
    let costEntry=client.reportingCOA.find(x=>x.id===costId);
    let classLabel=costEntry?costEntry.name.replace(' — Cost',''):p.label;
    let costCY=num(c.bs[costId]);
    let accDepCY=num(c.bs[accDepId]);
    let nbvCY=costCY-Math.abs(accDepCY);
    let costPY=hasPY?num(pyBs[costId]):null;
    let accDepPY=hasPY?num(pyBs[accDepId]):null;
    let nbvPY=hasPY?(costPY-Math.abs(accDepPY)):null;
    let depYtd=num(c.ytd[depId]);
    if(!costCY&&!accDepCY&&!costPY&&!accDepPY&&!depYtd)return;
    let noteKey='ppe_'+p.key;
    if(!client.ppeNotes[noteKey])client.ppeNotes[noteKey]={additions:0,disposals:0};
    let notes=client.ppeNotes[noteKey];
    let additions=num(notes.additions);
    let disposals=num(notes.disposals);
    let reconClosing=hasPY?(nbvPY+additions-disposals-depYtd):null;
    let reconDiff=reconClosing!==null?(nbvCY-reconClosing):null;
    let reconFlag=reconDiff!==null&&Math.abs(reconDiff)>1?`<span style="color:var(--bad);font-weight:bold"> ⚠ Reconciliation difference: ${moneyZ(reconDiff)}</span>`:'';
    html+=`<div style="margin-top:14px"><b style="font-size:13px">${esc(classLabel)}</b>${reconFlag}
    <table class="statement" style="margin-top:6px"><thead><tr><th></th><th class="right">Cost</th><th class="right">Acc. Dep</th><th class="right">NBV</th></tr></thead><tbody>`;
    if(hasPY){
      html+=`<tr><td>Opening balance (from PY BS)</td><td class="right">${moneyZ(costPY)}</td><td class="right">(${moneyZ(Math.abs(accDepPY))})</td><td class="right">${moneyZ(nbvPY)}</td></tr>`;
    }
    html+=`<tr><td>Additions <input type="number" value="${additions}" style="width:120px;padding:3px 6px;font-size:12px;margin-left:8px;border:1px solid #d1d5db;border-radius:4px" onchange="if(!client.ppeNotes['${noteKey}'])client.ppeNotes['${noteKey}']={};client.ppeNotes['${noteKey}'].additions=+this.value;renderReport()"></td><td class="right">${moneyZ(additions)}</td><td class="right">—</td><td class="right">${moneyZ(additions)}</td></tr>`;
    html+=`<tr><td>Disposals (at NBV) <input type="number" value="${disposals}" style="width:120px;padding:3px 6px;font-size:12px;margin-left:8px;border:1px solid #d1d5db;border-radius:4px" onchange="if(!client.ppeNotes['${noteKey}'])client.ppeNotes['${noteKey}']={};client.ppeNotes['${noteKey}'].disposals=+this.value;renderReport()"></td><td class="right">—</td><td class="right">—</td><td class="right">(${moneyZ(disposals)})</td></tr>`;
    html+=`<tr><td>Depreciation (from P&L YTD)</td><td class="right">—</td><td class="right">(${moneyZ(Math.abs(depYtd))})</td><td class="right">(${moneyZ(Math.abs(depYtd))})</td></tr>`;
    html+=`<tr class="grand-line"><td><b>Closing balance (from CY BS)</b></td><td class="right"><b>${moneyZ(costCY)}</b></td><td class="right"><b>(${moneyZ(Math.abs(accDepCY))})</b></td><td class="right"><b>${moneyZ(nbvCY)}</b></td></tr>`;
    html+='</tbody></table></div>';
  });
  return html;
}

    +'<thead><tr><th>KPI</th><th class="right">Result</th><th class="right">Benchmark</th><th style="text-align:center">Status</th></tr></thead>'

  return tiles+kpiTable+narrative;
})()}<div class="report-page"><div class="report-title">Profit and Loss</div>${statementTable(['Account','Note','Current Month','Budget','Variance %','YTD','YTD Budget','YTD Variance %'],pl)}</div>${(()=>{
  let streamPages='';
  let slist=getStreams();

      spl.push(...plSectionRows(sC,'expense','Expenses'));
      spl.push(...plSectionRows(sC,'other_expense','Other Expenses'));

      let snpY=sgpY+sumByType(sd.ytd,'other_income')-sumByType(sd.ytd,'expense')-sumByType(sd.ytd,'other_expense');
      spl.push(plCalcRow('Net Profit',null,snpM,snpY,0,0));

      streamPages+='<div class="report-page"><div class="report-title">Profit and Loss — '+esc(st.name)+'</div><p class="muted small" style="margin-bottom:8px">'+esc(apportionNote)+'</p>'+statementTable(['Account','Note','Current Month','','','YTD','',''],spl)+'</div>';
    });
  }
  return streamPages;
})()}<div class="report-page"><div class="report-title">Profit & Loss — Year on Year Comparison</div>${(()=>{
  let hasPY=Object.keys(client.raw.pl_py.accounts||{}).length>0;
  if(!hasPY)return '<p class="muted" style="padding:20px">No prior year P&L imported yet. Use the Imports screen to load a prior year P&L.</p>';
  let {pyMonthKey,pyYtdKeys}=pyKeys(c);
  let pyLabel=monthLabel(pyMonthKey);

  let pytdLabel='PY YTD '+pyLabel;

  let py=[];

  py.push(...pySectionRows(c,'cogs','Cost of Sales'));
  let gpCm=sumByType(c.cm,'income')-sumByType(c.cm,'cogs');
  let gpYtd=c.gp;
  let incCm=sumByType(c.cm,'income'), incYtd2=sumByType(c.ytd,'income');
  let gpPyMon=reportingCOA().filter(co=>co.type==='income').reduce((s,co)=>s+num(pyMon[co.id]),0)-reportingCOA().filter(co=>co.type==='cogs').reduce((s,co)=>s+num(pyMon[co.id]),0);
  let gpPyYtd=reportingCOA().filter(co=>co.type==='income').reduce((s,co)=>s+num(pyYtd[co.id]),0)-reportingCOA().filter(co=>co.type==='cogs').reduce((s,co)=>s+num(pyYtd[co.id]),0);
  let incPyMon=reportingCOA().filter(co=>co.type==='income').reduce((s,co)=>s+num(pyMon[co.id]),0);

  py.push([`<b>Gross Profit</b>`,"",`<b>${moneyZ(gpCm)}</b>`,`<b>${moneyZ(gpPyMon)}</b>`,`<b>${pct(gpChgM)}</b>${trafficDot(gpChgM,false)}`,`<b>${moneyZ(gpYtd)}</b>`,`<b>${moneyZ(gpPyYtd)}</b>`,`<b>${pct(gpChgY)}</b>${trafficDot(gpChgY,false)}`,'grand-line']);
  py.push(pyPctRow('GP %',gpCm,incCm,gpPyMon,incPyMon,gpYtd,incYtd2,gpPyYtd,incPyYtd));
  py.push(...pySectionRows(c,'other_income','Other Income'));
  py.push(...pySectionRows(c,'expense','Expenses'));
  py.push(...pySectionRows(c,'other_expense','Other Expenses'));
  let npCm=gpCm+sumByType(c.cm,'other_income')-sumByType(c.cm,'expense')-sumByType(c.cm,'other_expense');
  let npYtd=c.np;
  let npPyMon=gpPyMon+reportingCOA().filter(co=>co.type==='other_income').reduce((s,co)=>s+num(pyMon[co.id]),0)-reportingCOA().filter(co=>co.type==='expense'||co.type==='other_expense').reduce((s,co)=>s+num(pyMon[co.id]),0);
  let npPyYtd=gpPyYtd+reportingCOA().filter(co=>co.type==='other_income').reduce((s,co)=>s+num(pyYtd[co.id]),0)-reportingCOA().filter(co=>co.type==='expense'||co.type==='other_expense').reduce((s,co)=>s+num(pyYtd[co.id]),0);
  let npChgM=npPyMon?((npCm-npPyMon)/Math.abs(npPyMon)):0;
  let npChgY=npPyYtd?((npYtd-npPyYtd)/Math.abs(npPyYtd)):0;
  py.push([`<b>Net Profit</b>`,"",`<b>${moneyZ(npCm)}</b>`,`<b>${moneyZ(npPyMon)}</b>`,`<b>${pct(npChgM)}</b>${trafficDot(npChgM,false)}`,`<b>${moneyZ(npYtd)}</b>`,`<b>${moneyZ(npPyYtd)}</b>`,`<b>${pct(npChgY)}</b>${trafficDot(npChgY,false)}`,'grand-line']);
  py.push(pyPctRow('NP %',npCm,incCm,npPyMon,incPyMon,npYtd,incYtd2,npPyYtd,incPyYtd));
  return '<p class="muted" style="margin-bottom:8px">'+monthLabel(c.rm)+' vs '+pyLabel+' &nbsp;|&nbsp; '+ytdLabel+' vs '+pytdLabel+'</p>'+statementTable(['Account','Note',monthLabel(c.rm),pyLabel,'Chg %',ytdLabel,pytdLabel,'YTD Chg %'],py);
})()}</div><div class="report-page">${bsWarn}<div class="report-title">Balance Sheet</div>${statementTable(bsHeads,bs)}</div><div class="report-page"><div class="report-title">Notes to the Management Report</div>${renderReportNotes()}${ppeNotesHtml}</div><div class="report-page"><div class="report-title">Accounts Receivable (Debtors)</div>${ageingReportTable(client.raw.ar.rows||[],client.debtorNotes,true)}</div><div class="report-page"><div class="report-title">Accounts Payable (Creditors)</div>${ageingReportTable(client.raw.ap.rows||[],client.creditorNotes,false)}</div></div>`}
// ── File System Access API save/load ──────────────────────────────────────────
const _fsapiSupported=('showSaveFilePicker' in window);

function _defaultFileName(){
  return (client.settings.clientName||'client').replace(/[^a-z0-9]+/gi,'_')+'_management_report.json';
}

async function downloadJSON(){
  syncSettingsFromForm();
  const json=JSON.stringify(client,null,2);
  if(_fsapiSupported){
    try{
      // If we already have a handle (same session), write directly
      if(_fileHandle){
        const writable=await _fileHandle.createWritable();
        await writable.write(json);
        await writable.close();
        document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
        return;
      }
      // Otherwise show Save As dialog
      _fileHandle=await window.showSaveFilePicker({
        suggestedName:_defaultFileName(),
        types:[{description:'JSON File',accept:{'application/json':['.json']}}]
      });
      const writable=await _fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
    }catch(err){
      if(err.name!=='AbortError'){
        // Fall back to legacy download if something went wrong
        _legacyDownload(json);
      }
    }
  } else {
    _legacyDownload(json);
  }
}

async function saveAsJSON(){
  // Always show the Save As dialog (ignores existing handle)
  syncSettingsFromForm();
  const json=JSON.stringify(client,null,2);
  if(_fsapiSupported){
    try{
      _fileHandle=await window.showSaveFilePicker({
        suggestedName:_defaultFileName(),
        types:[{description:'JSON File',accept:{'application/json':['.json']}}]
      });
      const writable=await _fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
    }catch(err){
      if(err.name!=='AbortError') _legacyDownload(json);
    }
  } else {
    _legacyDownload(json);
  }
}

function _legacyDownload(json){
  let blob=new Blob([json],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=_defaultFileName();
  a.click();
}

function downloadSampleJSON(){downloadJSON()}

async function loadJSON(e){
  // Support both the file input element (e = event) and direct File System Access API open
  if(e && e.target && e.target.files){
    // Called from hidden <input type="file">
    let f=e.target.files[0];
    if(!f)return;
    let r=new FileReader();
    r.onload=ev=>{
      client=JSON.parse(ev.target.result);
      ensureClientDefaults();
      generateBreakdownNotes();
      _fileHandle=null;
      _skipNextSync=true;
      renderAll();
      show('dashboard');
    };
    r.readAsText(f);
  }
}

async function openFileJSON(){
  // Open via File System Access API — retains handle so Save writes back to same file
  if(_fsapiSupported){
    try{
      let [handle]=await window.showOpenFilePicker({
        types:[{description:'JSON File',accept:{'application/json':['.json']}}],
        multiple:false
      });
      _fileHandle=handle;
      let file=await handle.getFile();
      let text=await file.text();
      client=JSON.parse(text);
      ensureClientDefaults();
      generateBreakdownNotes();
      _skipNextSync=true;
      renderAll();
      show('dashboard');
      document.getElementById('saveState').textContent='Loaded: '+handle.name;
    }catch(err){
      if(err.name!=='AbortError') alert('Could not open file: '+err.message);
    }
  } else {
    // Fall back: trigger the hidden file input
    document.getElementById('legacyLoadInput').click();
  }
}
// ── End File System Access API ────────────────────────────────────────────────

// ── Roll Forward ──────────────────────────────────────────────────────────────
function rollForward(){
  if(!client.settings.clientName||client.settings.clientName==='Sample Client (Pty) Ltd'){
    alert('Please load a client file before rolling forward.');return;
  }
  let current=client.settings.reportMonth; // YYYY-MM
  let [y,m]=current.split('-').map(Number);
  let ny=m===12?y+1:y, nm=m===12?1:m+1;
  let nextMonth=ny+'-'+String(nm).padStart(2,'0');
  let nextLabel=MONTHS[nm-1]+' '+ny;
  if(!confirm('Roll forward from '+monthLabel(current)+' to '+nextLabel+'?\n\nThis will:\n  • Set report month to '+nextLabel+'\n  • Clear CY P&L, Balance Sheet, A/R and A/P data\n  • Reset QC status to Draft\n  • Flag all notes for review\n\nPrior year data is PRESERVED ('+( client.settings.pyLocked?'locked':'unlocked')+').\nBudgets, mappings and benchmarks are carried forward.\n\nThe current file will not be modified — save as a new file after rolling forward.'))return;

  // Advance report month
  client.settings.reportMonth=nextMonth;
  client.settings.status='Draft';

  // Clear imported data
  client.raw.pl={periods:[],accounts:{}};
  client.raw.bs={asOf:null,accounts:{}};
  client.raw.ar={asOf:null,rows:[]};
  client.raw.ap={asOf:null,rows:[]};
  // Keep prior year data intact — it becomes the new prior year reference

  // Flag all notes for review (needsReview=true, reviewed=false)
  (client.notes||[]).forEach(n=>{n.needsReview=true;n.reviewed=false;});

  // Flag executive summary / narrative for review
  if(client.kpiManual&&client.kpiManual.narrative){
    client.kpiManual.narrativeNeedsReview=true;
  }

  // Clear import audit trail for new period
  client.imports=[];

  _skipNextSync=true;
  renderAll();
  show('imports');
  alert('Rolled forward to '+nextLabel+'. Import the new QuickBooks files to continue.\n\nAll notes have been flagged for review — they must be updated before the report can be finalised.'+(client.settings.pyLocked?'\n\nPrior year data is LOCKED and was preserved.':''));
}
// ── End Roll Forward ──────────────────────────────────────────────────────────

initTabs();show('dashboard');
</script>
